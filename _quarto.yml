project:
  type: website
  output-dir: _site

execute:
  enabled: false

resources:
  - assets/**

website:
  title: "Stéphane Gonzalez"
  site-url: "https://stephanegonzalez.eu"
  description: "Stéphane Gonzalez is Professor of Economics at Université Jean Monnet and Deputy Director of GATE Lyon Saint-Étienne. Research in economic theory, game theory, social choice and axiomatic economics."
  open-graph: true
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Research
        href: research.qmd
      - text: Scientific organization
        href: scientific-organization.qmd
      - text: Teaching
        href: teaching.qmd
      - text: CV
        href: assets/cv/Stephane_Gonzalez_Academic_CV_August_2026_v4.pdf
      - text: Contact
        href: contact.qmd

format:
  html:
    theme: cosmo
    page-layout: full
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    css:
      - assets/css/site.css
    include-after-body:
      - _includes/site-scripts.html
