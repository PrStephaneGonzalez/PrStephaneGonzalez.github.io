}

function hittable(e){return e.alive&&HIT[e.type]&&!(e.type==='burglar'&&e.state==='eaten')&&!(e.type==='boss'&&e.dying);}

    for(const e of G.ents){if(!hittable(e))continue;const p=entP(e);if(Math.hypot(x-p.x,y-p.y)<p.r*0.6+Wp.r)add(e);}

function updateEnts(dt){
  for(const e of G.ents){
    switch(e.type){
      case 'pigeon':
        e.x+=e.vx*dt;e.y=e.by+Math.sin(G.t*e.fr+e.ph)*e.amp;e.dropT-=dt;
        if(e.dropT<=0){e.dropT=rnd(3,6);if(G.state==='play'&&Math.abs(e.x-HERO_X)<230&&e.y<420&&Math.random()<0.5)spawnPoop(e.x,e.y+20);}
        if((e.vx>0&&e.x>W+70)||(e.vx<0&&e.x<-70))e.alive=false;
        break;
      case 'burglar':
        if(e.state==='walk'){e.x+=-e.side*e.sp*dt;
          if(Math.abs(e.x-HERO_X)<30){if(G.bottle){G.bottle=false;G.bottleT=3;e.hasBottle=true;e.state='flee';loseHeart('steal',e.x,e.y-130);}else e.state='flee';}}
        else if(e.state==='flee'){e.x+=e.side*e.sp*1.7*dt;if(e.x<-70||e.x>W+70)e.alive=false;}
        break;
      case 'pig':{
        const b=e.b,face=e.side<0?1:-1;e.t+=dt;
        if(e.st==='in'){e.x+=face*720*dt;if(Math.abs(e.x+face*64-b.x)<20||(face>0?e.x+64>b.x:e.x-64<b.x)){e.st='eat';e.t=0;SFX.chomp();}}
        else if(e.st==='eat'){b.eatP=Math.min(1,e.t/0.55);b.x+=(e.x+face*60-b.x)*Math.min(1,dt*8);
          if(e.t>0.55){b.alive=false;e.st='out';e.t=0;SFX.burp();
            eparticle('🧢',b.x,b.y-110,40,rnd(-60,60),-380,1.2);
            G.fx.push({k:'text',txt:'*BURP*',x:e.x,y:e.y-120,t:0,dur:0.9,col:'#ff9ad0'});
            burst(e.x,e.y-40,10,['#ffffff','#ffd23a'],180);}}
        else{e.x+=e.side*420*dt;if(e.x<-110||e.x>W+110)e.alive=false;}
        break;}
      case 'annoy':
        e.y+=e.vy*dt;
        if(!e.poop){const prog=clamp(e.y/760,0,1),amp=e.def.zig?65:24;e.x=e.x0+(HERO_X-e.x0)*prog*0.8+Math.sin(G.t*(e.def.zig?5:2)+e.ph)*amp;}
        if(e.y>760){e.alive=false;
          if(e.poop&&Math.abs(e.x-HERO_X)>75)G.fx.push({k:'text',txt:'splotch',x:e.x,y:790,t:0,dur:0.7,col:'#b08a4a'});
          else{burst(e.x,e.y,10,['#8a5a2b','#c98b3a'],200);loseHeart('hit',HERO_X,700);}}
        break;
      case 'rept':
        e.x+=e.vx*dt;
        if((e.vx>0&&e.x>W+70)||(e.vx<0&&e.x<-70)){e.alive=false;G.saved++;
          addScore(25,clamp(e.x,60,W-60),LANE_R-40,'REPTILE SAUVÉ');say(QUIPS.save,true);
          G.fx.push({k:'emoji',e:'❤️',x:clamp(e.x,60,W-60),y:LANE_R-70,t:0,dur:0.8,size:50,rise:60});
          if(G.saved%3===0){G.slow=6;SFX.geco();say(QUIPS.geco,true);addText(HERO_X,420,'MODE GECO','#7dff6b',54);}}
        break;
      case 'boss':
        e.flash=Math.max(0,e.flash-dt*5);
        if(!e.dying){e.x+=e.vx*dt;if(e.x>W-120)e.vx=-Math.abs(e.vx);if(e.x<120)e.vx=Math.abs(e.vx);
          e.y=250+Math.sin(G.t*1.6)*45;e.tp-=dt;if(e.tp<=0){e.tp=1.9;spawnPoop(e.x,e.y+80);}
          e.tb-=dt;if(e.tb<=0){e.tb=7;spawnBurglar();}}
        else{e.y+=380*dt;e.rot+=9*dt;if(Math.random()<0.5)feathers(e.x,e.y,false);
          if(e.y>720){e.alive=false;burst(e.x,700,30,['#c5cbd6','#ffffff','#ffd23a'],420);startPlate();}}
        break;
    }
  }
  G.ents=G.ents.filter(e=>e.alive);
}
function updateFx(dt){
  for(const f of G.fx)f.t+=dt;
  for(const f of G.fx){
    if(f.k==='fly'&&f.t>=f.dur&&!f.done){f.done=true;SFX.pop();G.fx.push({k:'ring',x:f.tx,y:f.ty,t:0,dur:0.3,col:'#ffd23a'});
      if(G.state==='play'){G.gauge=Math.min(G.need,G.gauge+1);
        if(G.gauge>=G.need){
          if(LV().boss){G.gauge=0;if(G.lives<3){G.lives++;addText(HERO_X,600,'+1 ❤️','#ff7ab8',50);}else{G.score+=300;addText(HERO_X,600,'PLAT BONUS +300','#ffd23a',36);}SFX.plat();}
          else startPlate();}}}
  }
  G.fx=G.fx.filter(f=>f.t<f.dur+(f.k==='fly'?0.05:0));
  for(const p of G.parts){p.t+=dt;p.vy+=p.g*dt;p.x+=p.vx*dt+(p.sway?Math.sin(p.t*3+p.sway)*30*dt:0);p.y+=p.vy*dt;p.rot+=p.vr*dt;
    if(p.shape==='feather'){p.vx*=0.985;p.vy=Math.min(p.vy,110);}}
  G.parts=G.parts.filter(p=>p.t<p.life&&p.y<H+40);

}
function startPlate(){

function update(dt){
  G.t+=dt;G.stateT+=dt;
  if(G.cool>0)G.cool-=dt;
  G.recoil=Math.max(0,G.recoil-dt*7);
  if(G.headT>0){G.headT-=dt;if(G.headT<=0)G.head='idle';}
  if(G.shake>0)G.shake-=dt;if(G.flash>0)G.flash-=dt;
  G.catchCd=Math.max(0,(G.catchCd||0)-dt);if(G.quip){G.quip.t-=dt;if(G.quip.t<=0)G.quip=null;}
  if(G.hint>0&&G.state==='play')G.hint-=dt;
  updateFx(dt);
  if(G.state==='play'&&holdP&&WEAPONS[LV().weapon].auto&&G.cool<=0)shoot(holdP.x,holdP.y);
  if(G.state==='play'||G.state==='title'||G.state==='intro'){G.cooT-=dt;if(G.cooT<=0){
    const bossOn=G.state!=='title'&&LV().boss&&G.ents.some(e=>e.type==='boss');const n=nPigeons()+(bossOn?2:0);
    if(n>0){coo(bossOn&&Math.random()<0.4?rnd(0.55,0.65):rnd(0.85,1.2));G.cooT=rnd(0.9,2.4)/Math.min(2.6,0.6+n*0.3);}else G.cooT=1;}}
  switch(G.state){
    case 'title':G.tm.pig=(G.tm.pig||0)-dt;if(G.tm.pig<=0){G.tm.pig=1.3;if(nPigeons()<4)spawnPigeon('n');}updateEnts(dt);break;
    case 'play':{const sdt=dt*(G.slow>0?0.5:1);if(G.slow>0)G.slow-=dt;spawnLoop(sdt);updateEnts(sdt);
      if(!G.bottle){G.bottleT-=dt;if(G.bottleT<=0)G.bottle=true;}break;}
    case 'intro':if(G.stateT>2.0)setState('play');break;
    case 'plate':updateEnts(dt);if(G.stateT>3.0){G.rew=G.level;setState('reward');confetti(40);}break;
    case 'reward':case 'final':if(Math.random()<dt*14)confetti(1);break;
  }
}

  ctext('Score : '+G.score,270,820,36,'#ffd23a',INK);
  if(G.newBest)ctext('NOUVEAU RECORD !',270,862,26,'#7dff6b','#0b3b1a');else ctext('Record : '+G.best,270,862,22,'#ffd23a',INK);
  if(G.stateT>0.7&&Math.sin(G.t*5)>-0.4)ctext('TAPE POUR RÉESSAYER',270,912,32,'#7dff6b','#0b3b1a');
}

/* ================= BOUCLE ================= */
function draw(){
  const k=cv.width/W;ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0)ctx.translate(rnd(-1,1)*G.shake*22,rnd(-1,1)*G.shake*22);
  switch(G.state){
    case 'title':drawTitle();break;
    case 'reward':case 'final':drawReward();break;
    default:{
      const th=LV().theme;drawBG(th);
      if(LV().burg){if(G.bottle)bottle(HERO_X,BOTTLE_Y,1);else{ctx.save();ctx.globalAlpha=0.35;bottle(HERO_X,BOTTLE_Y,1);ctx.restore();}}
      for(const e of G.ents){switch(e.type){case 'pigeon':drawPigeon(e);break;case 'burglar':drawBurglar(e);break;case 'pig':drawPig(e);break;case 'annoy':drawAnnoy(e);break;case 'rept':drawRept(e);break;case 'boss':drawBoss(e);break;}}
      if(G.state!=='over')drawHero();
      drawFx();drawHUD();
      if(G.slow>0){ctx.fillStyle='rgba(60,255,120,.07)';ctx.fillRect(0,0,W,H);}
      if(G.flash>0){ctx.fillStyle='rgba(255,40,70,'+G.flash*0.9+')';ctx.fillRect(0,0,W,H);}
      if(G.state==='intro')drawIntro();
      if(G.state==='plate')drawPlate();
      if(G.state==='over')drawOver();
      if(G.state==='play'&&G.hint>0&&G.level===0)ctext('Tape sur les pigeons !',270,520,30,'#fff',INK);
    }
  }
  ctx.restore();
  if(G.state==='reward'||G.state==='final')drawFx();
}
let last=0;
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(frame);}
let holdP=null;
const toL=ev=>{const r=cv.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H};};
cv.addEventListener('pointerdown',ev=>{ev.preventDefault();const p=toL(ev);holdP=Math.hypot(p.x-500,p.y-96)<30?null:p;onTap(p.x,p.y);},{passive:false});
cv.addEventListener('pointermove',ev=>{if(holdP)holdP=toL(ev);});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{holdP=null;}));
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

window.__G=G;window.__holdSet=p=>{holdP=p;};window.__startLevel=startLevel;window.__setState=setState;
window.__spawn={burglar:spawnBurglar,rept:spawnRept,annoy:spawnAnnoy,pigeon:spawnPigeon};
requestAnimationFrame(frame);
const hm=location.hash.match(/l=(\d+)/);
if(hm){G.score=0;startLevel(+hm[1]);}
const hr2=location.hash.match(/r=(\d+)/);if(hr2){G.rew=+hr2[1];G.level=+hr2[1];setState(+hr2[1]===12?'final':'reward');}
if(/o=(\d+)/.test(location.hash)){G.level=+location.hash.match(/o=(\d+)/)[1];setState('over');}
})();
</script>
</body>
