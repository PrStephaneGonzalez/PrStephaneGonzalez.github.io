<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#191c34" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Une école de magie, une apprentie qui grandit et des découvertes en français et en mathématiques, à ton rythme."
    />
    <title>L’École de magie du Fil d’Or</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Aller au jeu</a>
    <header class="topbar">
      <button class="brand" id="home" aria-label="Accueil de l’école">
        <span class="brand-mark">✦</span><span>ÉCOLE DE MAGIE<br /><small>DU FIL D’OR</small></span>
      </button>
      <nav aria-label="Navigation">
        <button id="nav-castle" class="navbtn active">Mon école</button
        ><button id="nav-progress" class="navbtn">Ma progression</button
        ><button id="nav-library" class="navbtn">S’entraîner</button>
      </nav>
      <button id="parents" class="icon-button" aria-label="Ouvrir l’espace des parents">⚙</button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer>
      <span>Une aventure à ton rythme.</span
      ><button id="access">Aa <span>Lecture & sons</span></button
      ><button id="journey-account">◇ Mon compte</button>
      <div class="save-status">
        <span id="cloud-status" role="status">Sur cet appareil</span>
      </div>
    </footer>
    <dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
