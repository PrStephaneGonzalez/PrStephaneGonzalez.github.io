<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Les Gardiens de la Forêt Enchantée</title>
<meta name="description" content="Jeu éducatif de la grande section au début du CP : lettres, lecture, nombres, logique.">
<meta name="theme-color" content="#d4eef4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forêt Enchantée">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
@font-face{font-family:'Playwrite FR Trad';src:url(fonts/pw-fr-trad.woff2) format('woff2');font-display:swap}
/* le « b » isolé, en attaché, ressemblait à un « l » : on lui donne un dessin à ventre bien rond (Playwrite IT Trad, mêmes proportions) */
@font-face{font-family:'PW b';src:url(fonts/pw-b.woff2) format('woff2');font-display:swap}
.cb{font-family:'PW b','Playwrite FR Trad','Segoe Script','Apple Chancery',cursive!important}
/* Layout : trois territoires (Bois, Prairie, Lac) dessinés en plein écran, animaux = clairières ; chaque jeu occupe l'écran, consigne orale en haut, gestes en bas. Univers unique, clair et pastel. */
:root{
  --ink:#2b2142; --ink-soft:#5d5079; --paper:#fffaf4; --paper-2:#f2ebff;
  --berry:#d94f8c; --berry-d:#a8346a; --lilac:#9b7be0; --mint:#4fb487; --mint-d:#2f8a63;
  --sun:#ffc94d; --sky:#d4eef4; --meadow:#e6f3dc; --wood:#c9975f; --wood-d:#a87742; --blue:#3f86d9; --red:#e2596b; --red-d:#b33a4c;
  --shadow:rgba(43,33,66,.18);
  --display:'Grandstander','Andika','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Trebuchet MS',system-ui,sans-serif;
  --cursive:'Playwrite FR Trad','Segoe Script','Apple Chancery',cursive;
  color-scheme:light;
}
html,body{height:100%}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;position:relative;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--lilac);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
svg.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---------- carte ---------- */
.mapbar{display:flex;align-items:center;gap:12px;padding-block:10px;background:linear-gradient(var(--paper),rgba(255,250,244,.88));box-shadow:0 2px 0 rgba(43,33,66,.06);z-index:3}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand .t1{font:800 1.25rem/1 var(--display);color:var(--berry);white-space:nowrap}
.tally .ucount{font:800 .85rem/1 var(--body);color:var(--ink-soft);white-space:nowrap;align-self:center}
.brand .t2{font:600 .9rem/1.2 var(--display);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally{display:flex;gap:2px;margin-left:auto;font-size:1.2rem;flex-wrap:wrap;justify-content:flex-end}
.tally span{transition:filter .6s,opacity .6s}
.tally span.off{filter:grayscale(1);opacity:.35}
.ibtn{position:relative;flex:none;width:52px;height:52px;border-radius:50%;border:none;background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 var(--shadow)}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.lock{width:46px;height:46px;background:var(--paper-2);color:var(--ink-soft)}
.lock .ring{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);transform:rotate(-90deg);pointer-events:none}
.lock .ring circle{fill:none;stroke:var(--berry);stroke-width:4;stroke-dasharray:100;stroke-dashoffset:100}
.lock.holding .ring circle{stroke-dashoffset:0;transition:stroke-dashoffset 1.4s linear}
#stage{position:relative;flex:1;overflow:hidden;min-height:0}
#forest{position:absolute;inset:0;transition:filter 1.6s ease}
#shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,rgba(62,40,110,.15),rgba(40,22,80,.75));transition:opacity 1.6s ease}
.spots{position:absolute;top:0;bottom:0;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px))}
.spot{--sz:clamp(72px,14.5vmin,116px);position:absolute;transform:translate(-50%,-50%);width:var(--sz);height:var(--sz);border-radius:50%;border:none;padding:0;
  background:radial-gradient(circle at 50% 38%,#6b5a99,#2b2050 75%);box-shadow:0 0 0 5px rgba(43,33,80,.35),0 10px 22px rgba(25,15,55,.4);display:grid;place-items:center;font-size:calc(var(--sz)*.5);line-height:1}
.spot .ani{filter:grayscale(1) brightness(.75);opacity:.7;transition:filter 1s,opacity 1s}
.spot.locked::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px dashed #7a5a46;animation:spin 18s linear infinite;pointer-events:none}
.spot.blocked{background:radial-gradient(circle at 50% 38%,#4a405f,#1f1833 75%)}
.spot.blocked .ani{filter:grayscale(1) brightness(.5);opacity:.45}
.spot .req{position:absolute;top:-10px;left:-12px;display:flex;gap:2px;background:var(--paper);border-radius:99px;padding:3px 6px;font-size:calc(var(--sz)*.2);box-shadow:0 2px 0 var(--shadow)}
.spot .req span{filter:grayscale(1);opacity:.7}
.spot.free{background:radial-gradient(circle at 50% 38%,#fffdf8,#ffe9f4 80%);box-shadow:0 0 0 5px #fff,0 0 0 10px var(--c),0 12px 28px rgba(217,79,140,.35)}
.spot.free .ani{filter:none;opacity:1;animation:hop 2.8s ease-in-out infinite}
.spot .spark{position:absolute;top:-6px;right:-4px;font-size:calc(var(--sz)*.26)}
.spot .lv{position:absolute;bottom:calc(var(--sz)*-.3);left:50%;transform:translateX(-50%);font:700 .78rem/1 var(--body);color:#fff;background:rgba(43,33,66,.6);border-radius:99px;padding:3px 8px;white-space:nowrap;letter-spacing:.06em}
.spot.uni{--sz:clamp(58px,11vmin,90px)}
.spot.uni .ani{filter:grayscale(1) brightness(.8);opacity:.55}
.spot.uni.free .ani{filter:hue-rotate(var(--h));opacity:1}
.spot.uni .uring{position:absolute;inset:-7px;width:calc(100% + 14px);height:calc(100% + 14px);transform:rotate(-90deg);pointer-events:none}
.spot.uni .uring circle{fill:none;stroke-width:5;stroke-linecap:round}
.spot.siren{--sz:clamp(92px,19vmin,148px)}
.spot.siren:not(.free){background:radial-gradient(circle at 40% 32%,#f3eaff,#a28fd0 40%,#2e2357 80%)}
.tabs{display:flex;gap:8px;padding-block:8px 10px;background:linear-gradient(rgba(255,250,244,.88),var(--paper));box-shadow:0 -2px 0 rgba(43,33,66,.06);z-index:3}
.tab{flex:1;min-width:0;border:none;border-radius:18px;background:var(--paper-2);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 .82rem/1.1 var(--display);color:var(--ink-soft)}
.tab .e{font-size:1.5rem;line-height:1}
.tab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry-d)}

/* ---------- écran de jeu ---------- */
#game{background:linear-gradient(180deg,var(--sky),var(--meadow))}
.gbar{display:flex;align-items:center;gap:10px;padding-block:10px}
.gtitle{display:flex;align-items:center;gap:8px;min-width:0;flex:1;font:700 1.05rem/1.1 var(--display);color:var(--ink-soft)}
.gtitle .a{font-size:1.9rem}
.gtitle .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{display:flex;gap:3px}
.stars i{font-style:normal;width:30px;height:30px;display:grid;place-items:center}
.stars svg{width:28px;height:28px}
.stars .s0 path{fill:rgba(255,255,255,.7);stroke:#c7bcd9;stroke-width:1.5}
.stars .s1 path{fill:var(--sun);stroke:#e0a72a;stroke-width:1.5}
.stars .new{animation:starpop .6s ease}
.upill{font:800 1.05rem/1 var(--display);background:var(--paper);border-radius:99px;padding:9px 14px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.upill.new{animation:starpop .6s ease}
.ustrip{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding-block:0 4px}
.uc{min-width:30px;padding:3px 5px 2px;border-radius:9px;display:inline-flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.65);color:var(--ink-soft);font:700 .95rem/1.05 var(--body)}
.uc i{font-style:normal;font-size:.5rem;letter-spacing:1px;color:#d6971a}
.uc.cur b{font:400 1rem/1.15 var(--cursive)}
.uc.ok{background:#cdeedd;color:#185c3e}.uc.ok i{color:#2f8a63;font-size:.62rem}
.uc.wait{background:#fff0c9;color:#7a5410}.uc.wait i{font-size:.62rem;color:#7a5410}
.uc.bump{animation:starpop .6s ease;box-shadow:0 0 0 3px var(--sun)}
.lb.cur{font:400 clamp(2.2rem,8.5vmin,3.6rem)/1 var(--cursive);padding-bottom:.15em}
.wchoice.cur{font:400 clamp(1.5rem,6vmin,2.2rem)/1.3 var(--cursive);padding:.35em .7em .45em}
.wbig.cur{font:400 clamp(2rem,9vmin,3.4rem)/1.35 var(--cursive);letter-spacing:0}
.chips.cur .chip{font-family:var(--cursive);font-weight:400}
.prompt{display:flex;align-items:center;gap:10px;padding-block:4px 8px}
.fairy{font-size:2.4rem;flex:none;animation:float 3.2s ease-in-out infinite}
#ptext{margin:0;flex:1;min-width:0;background:var(--paper);border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:1.05rem;line-height:1.35;box-shadow:0 3px 0 var(--shadow)}
.speak{background:var(--sun);color:var(--ink)}
/* la zone de jeu se centre quand elle a la place ; sinon elle défile (jamais de bouton coupé et inaccessible, quel que soit le téléphone) */
#play{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;position:relative;padding-block:8px;overflow-x:hidden;overflow-y:auto;container-type:size;overscroll-behavior:contain}
#play>*{margin-block:auto}
@media (orientation:landscape) and (max-height:520px){.gbar{padding-block:4px}.prompt{padding-block:0 4px}}
#actions{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 16px;min-height:16px}
.col{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.5vh,22px);width:100%;max-width:680px;max-height:100%}
.bigbtn{display:inline-flex;align-items:center;gap:10px;border:none;border-radius:999px;padding:14px 26px;font:800 1.25rem/1 var(--display);color:#fff;background:var(--mint);box-shadow:0 5px 0 var(--mint-d)}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--mint-d)}
.bigbtn.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--shadow)}
.bigbtn.berry{background:var(--berry);box-shadow:0 5px 0 var(--berry-d)}
.bigbtn.red{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.bigbtn svg.ic{width:28px;height:28px;stroke-width:3}

/* lettres, syllabes */
.bubbles{display:flex;flex-wrap:wrap;gap:clamp(12px,3.5vmin,30px);justify-content:center;align-content:center;max-width:680px}
.lb{width:clamp(80px,21vmin,132px);aspect-ratio:1;border-radius:50%;border:none;padding:0;font:700 clamp(2.4rem,9.5vmin,4.2rem)/1 var(--body);color:var(--ink);
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0 11%,rgba(255,255,255,0) 12%),radial-gradient(circle at 50% 55%,var(--bc,#e7dbff) 55%,#fff 100%);
  box-shadow:inset -8px -10px 18px rgba(43,33,66,.08),0 8px 16px rgba(43,33,66,.15);animation:bob 3.4s ease-in-out infinite}
.lb.small{width:clamp(66px,17vmin,96px);font-size:clamp(2rem,8vmin,3rem);animation:none}
.model{font:700 clamp(4rem,15vmin,6.2rem)/1 var(--body);background:var(--paper);border-radius:28px;padding:.1em .45em;box-shadow:0 5px 0 var(--shadow)}
.scard{min-width:clamp(92px,24vmin,140px);padding:.35em .5em;border:none;border-radius:24px;background:var(--paper);box-shadow:0 5px 0 var(--shadow);font:700 clamp(2.2rem,9vmin,3.6rem)/1.1 var(--body)}
.egg{font-size:clamp(3.6rem,13vmin,5.4rem);line-height:1;transition:transform .3s}
.egg.wob{animation:wob 1.4s ease-in-out infinite}
.slots{display:flex;gap:10px;justify-content:center}
.slotb{min-width:clamp(64px,16vmin,92px);height:clamp(70px,17vmin,100px);border-radius:20px;border:4px dashed #cbbde3;background:rgba(255,255,255,.6);display:grid;place-items:center;font:700 clamp(2rem,8vmin,3.2rem)/1 var(--body);padding:0 8px}
.slotb.fill{border-style:solid;border-color:var(--lilac);background:var(--paper)}
.tiles{display:flex;gap:clamp(8px,2.5vmin,16px);flex-wrap:wrap;justify-content:center}

/* images et mots */
.choices{display:flex;flex-wrap:wrap;gap:clamp(12px,3vmin,24px);justify-content:center;align-content:center;max-width:680px}
.picw{position:relative}
.pic{width:clamp(92px,24vmin,136px);aspect-ratio:1;border:none;border-radius:26px;background:var(--paper);box-shadow:0 5px 0 var(--shadow);font-size:clamp(2.8rem,11vmin,4.2rem);line-height:1;display:grid;place-items:center;padding:0}
.ear{position:absolute;top:-8px;right:-8px;width:40px;height:40px;border-radius:50%;border:none;background:var(--sun);font-size:1.05rem;box-shadow:0 2px 0 var(--shadow);display:grid;place-items:center;padding:0}
.bigpic{font-size:clamp(4.2rem,16vmin,6.4rem);line-height:1;position:relative;background:var(--paper);border-radius:30px;padding:.12em .22em;box-shadow:0 5px 0 var(--shadow)}
.bigpic .ear{top:-6px;right:-10px}
.clap{min-width:clamp(78px,19vmin,112px);border:none;border-radius:22px;background:var(--paper);box-shadow:0 5px 0 var(--shadow);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.clap b{font:800 clamp(2rem,8vmin,2.8rem)/1 var(--display)}
.clap span{font-size:.95rem;letter-spacing:-2px}
.wbig{font:700 clamp(2.8rem,12vmin,4.6rem)/1.1 var(--body);background:var(--paper);border-radius:26px;padding:.15em .5em;box-shadow:0 5px 0 var(--shadow);letter-spacing:.03em}
.wbig.colored .sy:nth-child(odd){color:var(--berry)}
.wbig.colored .sy:nth-child(even){color:var(--blue)}
.wchoice{border:none;border-radius:22px;background:var(--paper);box-shadow:0 5px 0 var(--shadow);font:700 clamp(1.8rem,7vmin,2.6rem)/1.1 var(--body);padding:.3em .7em}
.sent{font:700 clamp(1.5rem,5.6vmin,2.2rem)/1.35 var(--body);background:var(--paper);border-radius:24px;padding:.5em .8em;box-shadow:0 5px 0 var(--shadow);text-align:center;max-width:30ch;text-wrap:balance}
.clues{background:var(--paper);border-radius:20px;padding:10px 16px;box-shadow:0 4px 0 var(--shadow);font-size:1.1rem;line-height:1.5;margin:0;list-style:none}

/* noisettes */
.sq{display:flex;align-items:center;gap:14px}
.sq .ani{font-size:clamp(2.2rem,min(10vmin,9cqh),4.4rem);line-height:1}
.sq .num{font:800 clamp(2.1rem,min(10vmin,9cqh),4rem)/1 var(--display);background:var(--paper);border-radius:24px;padding:.12em .5em;box-shadow:0 5px 0 var(--shadow);min-width:1.6em;text-align:center}
.frames{display:flex;flex-direction:column;gap:10px;width:min(100%,460px)}
.frame{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(5px,1.6vmin,10px);padding:clamp(8px,2.4vmin,14px);background:var(--wood);border-radius:22px;box-shadow:inset 0 -7px 0 var(--wood-d),0 6px 14px var(--shadow)}
.frames.two{width:min(100%,460px,max(170px,calc((100cqh - 118px)*1.25)))}
.frames.two .frame{padding:8px;gap:5px}
.slot{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22);border:3px dashed rgba(255,255,255,.55);display:grid;place-items:center}
.slot.has{border-style:solid;border-color:rgba(255,255,255,.35)}
.nut{font-size:clamp(1.6rem,7vmin,2.6rem);background:none;border:none;padding:0;line-height:1;animation:drop .28s ease-out;transition:transform .2s,filter .2s}
.frames.two .nut{font-size:clamp(1.2rem,5vmin,2rem)}
.nut.fixed{filter:sepia(.4) saturate(.7) brightness(1.15);cursor:default}
.counted{transform:scale(1.3);filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 4px var(--sun))}
.pile{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:10px 20px 10px 14px;background:var(--wood);box-shadow:0 5px 0 var(--wood-d);font:800 1.4rem/1 var(--display);color:#fff}
.pile .e{font-size:2rem}
.pile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--wood-d)}

/* formes */
.shp{width:clamp(92px,25vmin,136px);aspect-ratio:1;border:none;border-radius:26px;background:var(--paper);box-shadow:0 5px 0 var(--shadow);padding:8px}
.shp svg{width:100%;height:100%;display:block}
.shp.found{background:#e3f7ec;box-shadow:0 0 0 5px var(--mint),0 5px 0 var(--shadow);cursor:default}
.choices.six .shp{width:clamp(84px,26vmin,120px)}

/* repérage */
.scene{position:relative;width:min(100%,58vh,470px);aspect-ratio:1;max-width:100%;border-radius:32px;
  background:radial-gradient(140% 60% at 50% 100%,#a6d98f 0 45%,rgba(166,217,143,0) 46%),linear-gradient(#e9f7ff,#dff3e4);box-shadow:0 6px 16px var(--shadow)}
.obj{position:absolute;transform:translate(-50%,-50%);line-height:1;background:none;border:none;padding:6px;border-radius:50%}
.obj.ref{font-size:clamp(4rem,16vmin,6.8rem);pointer-events:none}
.obj.c{font-size:clamp(2.2rem,8.5vmin,3.5rem)}
.scene.two .obj.ref{font-size:clamp(3.2rem,12vmin,5.4rem)}
.gcol{height:100%;justify-content:center;gap:clamp(6px,1.6cqh,14px)}
.gcol .mgrid{width:auto;max-width:100%;max-height:400px;flex:1 1 0;min-height:0;aspect-ratio:1}
.gcol .prog{flex:none}
.mgrid{display:grid;gap:6px;width:min(100%,46vh,400px);aspect-ratio:1;padding:8px;background:#9fd18b;border-radius:22px;box-shadow:inset 0 -6px 0 #7cb769,0 6px 14px var(--shadow)}
.mcell{background:#c4e6b2;border-radius:12px;display:grid;place-items:center;font-size:clamp(1.4rem,6vmin,2.6rem);line-height:1}
.mcell.path{background:#f2e3b8}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
.arrow{border:none;border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--shadow);display:grid;place-items:center}
.arrow svg{width:32px;height:32px;fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.prog{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;align-items:center;justify-content:center;background:rgba(255,255,255,.7);border-radius:16px;padding:6px 10px;max-width:100%}
.prog svg{width:28px;height:28px;fill:none;stroke:var(--berry);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.prog .run{background:var(--sun);border-radius:8px}
.prog .ph{color:var(--ink-soft);font-size:.95rem}

/* svg plein cadre (lianes, balances, chemins) */
.fill{width:100%;height:100%;display:block}
.bar{cursor:pointer;transition:transform .9s cubic-bezier(.4,1.4,.6,1)}
.bar.hint rect.v{animation:glow 1s ease-in-out infinite alternate}
.pan{cursor:pointer}
.pan.hint circle.hl{opacity:1}

.tubes{display:flex;flex-wrap:wrap;gap:clamp(10px,3vmin,26px);justify-content:center;align-items:flex-end;max-width:640px;--u:clamp(20px,min(7vh,6.5cqh),48px)}
.tube{width:clamp(48px,12vmin,72px);height:calc(var(--cap)*var(--u) + 30px);border:4px solid rgba(255,255,255,.95);border-top-width:0;border-radius:6px 6px 34px 34px;
  background:linear-gradient(90deg,rgba(255,255,255,.45),rgba(255,255,255,.15) 40%,rgba(255,255,255,.4));display:flex;flex-direction:column-reverse;padding:4px;overflow:hidden;
  box-shadow:0 6px 12px var(--shadow);transition:transform .2s ease}
.tube.sel{transform:translateY(-18px)}
.tube.done{box-shadow:0 0 0 4px var(--sun),0 0 22px rgba(255,201,77,.8)}
.layer{flex:none;height:var(--u);background:var(--col);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.layer:first-child{border-radius:0 0 28px 28px}

.node{cursor:pointer}
.node circle{fill:#fff;stroke:#d8c9ef;stroke-width:4;transition:fill .3s,stroke .3s}
.node.v circle{fill:#ffe1f0;stroke:var(--berry)}
.node.cur circle{stroke:var(--sun);stroke-width:7}
.node.goal circle{animation:glow .7s ease-in-out infinite alternate;stroke:var(--mint);stroke-width:8}
.edge{stroke:#b89b70;stroke-width:6;stroke-dasharray:2 12;stroke-linecap:round;transition:stroke .3s}
.edge.u{stroke:var(--sun);stroke-width:12;stroke-dasharray:none}
.fly{transition:transform .35s ease;pointer-events:none}

/* ours */
.baskets{display:flex;gap:clamp(12px,4vmin,30px);justify-content:center;flex-wrap:wrap}
.basket{position:relative;width:clamp(140px,40vmin,220px);aspect-ratio:1.15;border:none;border-radius:28px 28px 60px 60px;background:var(--wood);box-shadow:inset 0 -8px 0 var(--wood-d),0 6px 14px var(--shadow);padding:0}
.basket .it{position:absolute;transform:translate(-50%,-50%);font-size:clamp(1.4rem,5.5vmin,2.2rem);line-height:1}
.heap{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:300px;font-size:clamp(1.8rem,7vmin,2.8rem);line-height:1;align-items:center}
.heap .it{display:inline-block;transition:transform .2s,opacity .8s,filter .2s}
.heap.arrive .it{animation:drop .5s ease-out backwards}
.it.gone{opacity:.12;transform:translateY(-26px) scale(.8)}
.story{display:flex;align-items:center;gap:clamp(8px,3vmin,22px);flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.55);border-radius:26px;padding:14px 18px}
.op{font:800 clamp(2rem,8vmin,3rem)/1 var(--display);color:var(--ink-soft)}
.leafbox{position:relative;display:grid;place-items:center;min-width:110px;min-height:100px}
.leafbox .leaf{font-size:clamp(4.4rem,16vmin,6rem);line-height:1;transition:transform .8s,opacity .8s;position:relative;z-index:2}
.leafbox .heap{position:absolute;inset:0;align-content:center;z-index:1}
.leafbox.open .leaf{transform:translate(40%,-50%) rotate(40deg);opacity:.35}
.eq{font:800 clamp(2.8rem,12vmin,4.4rem)/1 var(--display);background:var(--paper);border-radius:26px;padding:.2em .5em;box-shadow:0 5px 0 var(--shadow);font-variant-numeric:tabular-nums}
.nums{display:flex;gap:clamp(10px,3vmin,20px);flex-wrap:wrap;justify-content:center}
.numb{width:clamp(70px,18vmin,100px);aspect-ratio:1;border:none;border-radius:24px;background:var(--paper);box-shadow:0 5px 0 var(--shadow);font:800 clamp(2rem,8vmin,3rem)/1 var(--display)}

/* tortue */
.seq{display:flex;gap:clamp(4px,1.6vmin,10px);flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.6);border-radius:22px;padding:12px 14px;font-size:clamp(1.8rem,7vmin,2.8rem);line-height:1;align-items:center}
.seq svg{width:clamp(36px,10vmin,56px);height:clamp(36px,10vmin,56px);display:block}
.qmark{display:grid;place-items:center;width:clamp(42px,11vmin,60px);height:clamp(42px,11vmin,60px);border-radius:14px;border:4px dashed var(--lilac);font:800 1.8rem/1 var(--display);color:var(--lilac)}
.sgrid{display:grid;gap:5px;padding:8px;background:var(--lilac);border-radius:20px;box-shadow:0 6px 14px var(--shadow)}
.cell{width:clamp(56px,16vmin,84px);aspect-ratio:1;border:none;border-radius:14px;background:#efe8fb;font-size:clamp(1.8rem,7vmin,2.8rem);line-height:1;display:grid;place-items:center;padding:0}
.cell.blank{background:#fff;box-shadow:inset 0 0 0 3px #d9cdf1}
.cell.sel{box-shadow:inset 0 0 0 5px var(--sun)}
.sgrid.four .cell:nth-child(4n+2){margin-right:6px}
.sgrid.four .cell:nth-child(n+5):nth-child(-n+8){margin-bottom:6px}
.pal{display:flex;gap:12px;justify-content:center}

/* overlays */
[hidden]{display:none!important}
.field{position:relative;width:100%;max-width:760px;height:min(56vh,500px);border-radius:28px;background:linear-gradient(#cfe4ff,#f3e8ff 60%,#fff2f8);box-shadow:inset 0 0 0 3px rgba(255,255,255,.75);overflow:hidden}
.field .fw{position:absolute;transform:translate(-50%,-50%)}
.field .fb{width:clamp(58px,12.5vmin,88px);aspect-ratio:1;border-radius:50%;border:none;padding:0;background:radial-gradient(circle at 35% 30%,#fff,var(--bc) 72%);box-shadow:0 4px 0 rgba(43,33,80,.14);font:700 clamp(1.5rem,5.6vmin,2.4rem)/1 var(--body);color:var(--ink);animation:float 4s ease-in-out infinite}
.field .fb.cur{font:400 clamp(1.4rem,5.2vmin,2.2rem)/1 var(--cursive);padding-bottom:.15em}
.field .fb.got{background:#c9f2d3;box-shadow:0 0 0 5px #4fb487;animation:none}
.found{font-size:clamp(1.8rem,6vmin,2.4rem);letter-spacing:.15em;min-height:1.2em;color:#f0b51e;text-shadow:0 2px 0 rgba(43,33,66,.15)}
.mem{display:grid;gap:clamp(8px,2vmin,14px);grid-template-columns:repeat(var(--mc),clamp(72px,19vmin,120px))}
.mc{aspect-ratio:3/4;border:none;border-radius:18px;background:linear-gradient(#bcd8ff,#e4d4ff);box-shadow:0 5px 0 var(--shadow);font:700 clamp(1.7rem,7vmin,2.8rem)/1 var(--body);color:var(--ink);padding:0}
.mc.up{background:var(--paper)}.mc .cur{font:400 clamp(1.5rem,6vmin,2.4rem)/1 var(--cursive)}
.mc.ok{background:#d7f4dc;box-shadow:0 0 0 4px #4fb487}
.model.cur{font:400 clamp(3.4rem,13vmin,5.4rem)/1.2 var(--cursive);padding-bottom:.2em}
.scard.cur{font:400 clamp(1.9rem,8vmin,3rem)/1.2 var(--cursive)}
.lopts{display:flex;gap:clamp(14px,4vmin,32px);justify-content:center;flex-wrap:wrap}
.lopt{display:flex;flex-direction:column;align-items:center;gap:10px}
.lopt .spk{width:clamp(82px,20vmin,112px);aspect-ratio:1;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#fff,var(--bc) 72%);font-size:clamp(2rem,8vmin,3rem);box-shadow:0 4px 0 var(--shadow)}
.lopt .spk.playing{box-shadow:0 0 0 6px var(--sun)}
.fx1{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px #ffe680)}
.fx2{filter:grayscale(.5) saturate(.85) brightness(1.25) drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #b9cdf0)}
.fx3,.fx5{filter:sepia(1) saturate(3.4) hue-rotate(-10deg) brightness(1.12) drop-shadow(0 0 4px #ffe28a) drop-shadow(0 0 12px #ffcf3f)}
.fx4{animation:rbw 3.2s linear infinite}
.spot.free .ani.fx1{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px #ffe680)}
.spot.free .ani.fx2{filter:grayscale(.5) saturate(.85) brightness(1.25) drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #b9cdf0)}
.spot.free .ani.fx3,.spot.free .ani.fx5{filter:sepia(1) saturate(3.4) hue-rotate(-10deg) brightness(1.12) drop-shadow(0 0 4px #ffe28a) drop-shadow(0 0 12px #ffcf3f)}
.spot.free .ani.fx4{animation:hop 2.8s ease-in-out infinite,rbw 3.2s linear infinite}
@keyframes rbw{from{filter:hue-rotate(0deg) saturate(1.8) drop-shadow(0 0 6px #fff)}to{filter:hue-rotate(360deg) saturate(1.8) drop-shadow(0 0 6px #fff)}}
.spot.free.mg1{box-shadow:0 0 0 5px #fff,0 0 0 10px var(--c),0 0 26px 8px rgba(255,240,160,.85)}
.spot.free.mg2{background:radial-gradient(circle at 50% 38%,#fff,#e3eaf5 80%);box-shadow:0 0 0 5px #fff,0 0 0 10px #c3cfe2,0 0 28px 10px rgba(225,235,255,.95)}
.spot.free.mg3{background:radial-gradient(circle at 50% 38%,#fffbea,#ffe7a0 80%);box-shadow:0 0 0 5px #fff6d6,0 0 0 10px #ffc93c,0 0 30px 12px rgba(255,214,90,.9)}
.spot.free.mg4{box-shadow:0 0 0 5px #fff,0 0 30px 12px rgba(255,255,255,.9)}
.spot.free.mg5{background:radial-gradient(circle at 50% 38%,#fffbea,#ffd86b 85%);box-shadow:0 0 0 5px #fff6d6,0 0 34px 14px rgba(255,220,120,.95)}
.spot.mg4::before,.spot.mg5::before,.hero.mg4::before,.hero.mg5::before,.spot.uni.super::before{content:"";position:absolute;inset:-13px;border-radius:50%;background:conic-gradient(#ff9db9,#ffc98a,#fff09a,#a8e6a1,#9fd3ff,#c6a8ff,#ff9db9);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));mask:radial-gradient(farthest-side,transparent calc(100% - 10px),#000 calc(100% - 9px));animation:spin 5s linear infinite;pointer-events:none}
.spot .crown,.hero .crown{position:absolute;top:calc(var(--sz) * -.38);left:50%;transform:translateX(-50%) rotate(-8deg);font-size:calc(var(--sz) * .34);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.spot .orbit,.hero .orbit{position:absolute;inset:0;animation:spin 16s linear infinite;pointer-events:none}
.spot .orbit i,.hero .orbit i{position:absolute;left:50%;top:50%;width:1em;height:1em;margin:-.5em 0 0 -.5em;text-align:center;font-style:normal;line-height:1;color:#ffd23f;font-size:calc(var(--sz) * .2);text-shadow:0 0 6px #fff,0 0 2px #b8860b}
.hero.mgh{--sz:150px;position:relative}
.hero.mg2{background:radial-gradient(circle at 50% 38%,#fff,#e3eaf5 80%)}.hero.mg3,.hero.mg5{background:radial-gradient(circle at 50% 38%,#fffbea,#ffd86b 85%)}
.tease{display:flex;align-items:center;gap:12px;background:var(--paper-2);border-radius:20px;padding:10px 14px;margin:-4px 0 16px;text-align:left;color:var(--ink);font-weight:700;line-height:1.3}
.tease .mini{font-size:44px;line-height:1;flex:none}.tease .mini b{color:#f0b51e}
.nextf{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font:700 1.05rem/1 var(--body);color:var(--ink-soft)}.nextf span{font-size:1.5rem}.nextf b{color:#f0b51e;font-size:1.4rem}
.spot.uni.super{--sz:clamp(70px,13vmin,108px)}
.spot.uni.super.free .ani{animation:rbw 3.2s linear infinite}
.field .fb.long{font-size:clamp(1rem,3.9vmin,1.55rem)}
.mc .long{font-size:clamp(.95rem,3.8vmin,1.4rem)}
.wd .g{display:inline}.wd .g.s1{color:#3f86d9}.wd .g.mute{color:#b4abc6}
.lopt .pickb{border:none;border-radius:16px;background:var(--mint);color:#fff;font:700 1.5rem/1 var(--body);padding:8px 22px;box-shadow:0 4px 0 var(--mint-d)}
.whoq{font-family:var(--fd,inherit);font-size:1.5rem;margin:6px 0 10px;color:#fff}
#whoList{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:12px}
.whobtn{font:inherit;font-weight:800;font-size:1.35rem;border:0;border-radius:22px;padding:12px 24px;background:#fff;color:#4a3a78;box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer}
.whobtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
#whoForm{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
#whoName{font:inherit;font-size:1.3rem;padding:12px 16px;border-radius:18px;border:3px solid #fff;width:min(240px,70vw);text-align:center}
.whomsg{min-height:1.4em;margin:8px 0 0;color:#fff;font-weight:700}
#sync{display:inline-block;vertical-align:middle;margin-left:4px;font:700 .72rem/1.2 var(--body);border:0;border-radius:12px;padding:3px 9px;background:var(--paper-2);color:var(--ink-soft);cursor:pointer;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sync.off{background:rgba(255,230,180,.95)}
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:rgba(43,33,66,.55)}
.card{background:var(--paper);border-radius:34px;padding:28px 24px;max-width:min(92vw,460px);text-align:center;box-shadow:0 18px 40px rgba(20,10,40,.35);position:relative;overflow:hidden}
.card h2{font:800 clamp(1.6rem,6vmin,2.1rem)/1.15 var(--display);margin:6px 0 8px;text-wrap:balance;color:var(--berry)}
.card p{margin:0 0 18px;color:var(--ink-soft);line-height:1.45}
.card .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hero{width:150px;height:150px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:84px;line-height:1;
  background:radial-gradient(circle,#fff 52%,rgba(255,255,255,0) 53%),conic-gradient(#ff8fc8,#ffd36b,#8fe3a0,#7cc8ff,#b99bff,#ff8fc8);animation:hop 2.2s ease-in-out infinite}
.hero.dim span{filter:grayscale(1);opacity:.6}
.meter{height:16px;border-radius:99px;background:#eee6f7;overflow:hidden;margin:0 auto 18px;max-width:260px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ff8fc8,#b99bff);border-radius:99px}
.start{background:radial-gradient(120% 90% at 50% 30%,rgba(255,250,244,.92),rgba(212,238,244,.96))}
.start .ttl{font:800 clamp(2rem,8vmin,3.2rem)/1.05 var(--display);color:var(--berry);margin:0;text-wrap:balance}
.start .sub{font:600 clamp(1.05rem,4vmin,1.35rem)/1.3 var(--display);color:var(--ink-soft);margin:8px 0 22px}
.start .big{font-size:5rem;line-height:1;animation:float 3s ease-in-out infinite}
.start small{display:block;margin-top:20px;color:var(--ink-soft);font-size:.85rem;max-width:34ch;margin-inline:auto;line-height:1.4}
.confetti{position:absolute;top:-20px;font-size:20px;animation:fall linear forwards;pointer-events:none}

/* espace parents */
.sheetwrap{place-items:start center;grid-template-columns:minmax(0,1fr);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:20px;-webkit-user-select:text;user-select:text}
.sheet{background:var(--paper);border-radius:26px;width:min(100%,800px);min-width:0;overflow-wrap:anywhere;padding:22px clamp(16px,4vmin,30px) 28px;box-shadow:0 18px 40px rgba(20,10,40,.35)}
.sheet h2{font:800 1.6rem/1.1 var(--display);margin:0;color:var(--ink)}
.sheet h3{font:700 .8rem/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin:24px 0 10px}
.sheet .top{display:flex;align-items:center;gap:12px;justify-content:space-between}
.sheet p{line-height:1.5;margin:6px 0;max-width:65ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--paper-2);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font:800 1.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:.85rem;color:var(--ink-soft)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
td,th{padding:8px 6px;text-align:left;border-bottom:1px solid #eadff5;vertical-align:middle}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:700}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.ok{background:#dcf5e8;color:#1f6b4a}.pill.no{background:#f0eaf7;color:var(--ink-soft)}.pill.bl{background:#f6eee0;color:#7a5a2a}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:36px;height:36px;padding:0 8px;border-radius:10px;display:inline-grid;place-items:center;font-weight:700;font-size:1.02rem;border:2px solid transparent}
.chip.acquis{background:#cdeedd;color:#185c3e;border-color:#7cc8a2}
.chip.cours{background:#fff0c9;color:#7a5410;border-color:#f0cf7a}
.chip.nv{background:#f3f0f7;color:#a79cb8;border-color:#e6e0ee}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft);margin-top:8px;align-items:center}
.legend .chip{min-width:22px;height:22px;font-size:.7rem}
.muted{color:var(--ink-soft);font-size:.9rem}
.danger{background:none;border:2px solid #e7b6c9;color:var(--berry-d);border-radius:12px;padding:10px 14px;font-weight:700}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* animations */
.shake{animation:shake .45s ease}
.hint{animation:hintp 1s ease-in-out infinite}
.pop{animation:pop .45s ease forwards}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-6px)}55%{transform:translateY(-6px)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes hintp{0%,100%{box-shadow:0 0 0 0 rgba(255,201,77,0);transform:scale(1)}50%{box-shadow:0 0 0 12px rgba(255,201,77,.75);transform:scale(1.08)}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1.15);box-shadow:0 0 0 10px rgba(79,180,135,.6)}}
@keyframes drop{from{transform:translateY(-24px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes starpop{0%{transform:scale(.3) rotate(-30deg)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (max-width:520px){.brand{flex:1 1 0}.brand .t1{display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-size:1.05rem}#sync{margin-left:0;max-width:100%}.brand .t2{display:none}.tally{max-width:46%;font-size:1rem}}
@media (max-height:700px){.pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px)}.arrow svg{width:28px;height:28px}.bigbtn{padding-block:11px}}
@media (max-width:420px){.tally{font-size:1rem}.stars i{width:24px}.stars svg{width:23px;height:23px}.gtitle .n{display:none}.pad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px)}}
</style>
</head>
<body>


<div id="app">
  <section id="map" class="screen">
    <header class="mapbar gut">
      <div class="brand"><span class="t1">Les Gardiens <button id="sync" type="button" hidden></button></span><span class="t2" id="terrName"></span></div>
      <div id="tally" class="tally" aria-label="Animaux libérés"></div>
      <button id="lockBtn" class="ibtn lock" aria-label="Espace parents : maintenir appuyé">
        <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
        <svg class="ring" viewBox="0 0 52 52"><circle cx="26" cy="26" r="23" pathLength="100"/></svg>
      </button>
    </header>
    <div id="stage"><canvas id="forest"></canvas><div id="shade"></div><div id="spots" class="spots"></div></div>
    <nav id="tabs" class="tabs gut"></nav>
  </section>

  <section id="game" class="screen" hidden>
    <header class="gbar gut">
      <button id="homeBtn" class="ibtn" aria-label="Retour à la carte"><svg class="ic" viewBox="0 0 24 24"><path d="M3.5 11.5 12 4.5l8.5 7"/><path d="M6 10v9.5h12V10"/><path d="M10 19.5v-5h4v5"/></svg></button>
      <div class="gtitle"><span class="a" id="gAni"></span><span class="n" id="gName"></span></div>
      <div id="stars" class="stars" aria-label="Étoiles"></div>
    </header>
    <div class="prompt gut">
      <span class="fairy" aria-hidden="true">🧚</span>
      <p id="ptext"></p>
      <button id="sayBtn" class="ibtn speak" aria-label="Réécouter la consigne"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
    </div>
    <div id="ustrip" class="ustrip gut" hidden></div>
    <main id="play" class="gut"></main>
    <footer id="actions" class="gut"></footer>
  </section>

  <div id="start" class="overlay start">
    <div class="card" style="background:transparent;box-shadow:none">
      <div class="big" aria-hidden="true">🧚</div>
      <h1 class="ttl">Les Gardiens de la Forêt Enchantée</h1>
      <p class="sub">Une sorcière a plongé la forêt dans l'ombre.<br>Libère les animaux, puis la sirène !</p>
      <div id="who">
        <h2 class="whoq">Qui joue ?</h2>
        <div id="whoList"></div>

/* fusion de deux sauvegardes : on ne perd jamais de progrès */
function mergeSt(a,b){const o=fresh();
  GAMES.forEach(g=>{const x=a.games[g.id],y=b.games[g.id];
    /* les étoiles reviennent à 0 à chaque récompense ou refus : le compteur rc (qui ne fait que croître) dit quelle copie est la plus récente */
    const w=(x.level!==y.level?x.level>y.level:(x.rc||0)!==(y.rc||0)?(x.rc||0)>(y.rc||0):x.stars>=y.stars)?x:y;
    o.games[g.id]=Object.assign({},w,{freed:!!(x.freed||y.freed),mastered:!!(x.mastered||y.mastered),bonus:Math.max(x.bonus||0,y.bonus||0),rc:Math.max(x.rc||0,y.rc||0)})});
  new Set([...Object.keys(a.items),...Object.keys(b.items)]).forEach(k=>{const x=a.items[k]||{n:0,ok:0,days:[]},y=b.items[k]||{n:0,ok:0,days:[]};
    o.items[k]={n:Math.max(x.n,y.n),ok:Math.max(x.ok,y.ok),days:[...new Set([...(x.days||[]),...(y.days||[])])].sort()}});
  new Set([...Object.keys(a.days),...Object.keys(b.days)]).forEach(k=>{const x=a.days[k]||{rounds:0,ok:0},y=b.days[k]||{rounds:0,ok:0};o.days[k]={rounds:Math.max(x.rounds,y.rounds),ok:Math.max(x.ok,y.ok)}});
  o.visits=Math.max(a.visits,b.visits);o.unicorns=Object.assign({},a.unicorns,b.unicorns);o.terr=a.terr;return o}

function countAloud(els,done,startAt){const rid=cur.rid;let i=0;const base=startAt||0;

function gridHam(R,C,cycle,lv){const N=R*C;const nb=i=>{const r=Math.floor(i/C),c=i%C,o=[];if(r>0)o.push(i-C);if(r<R-1)o.push(i+C);if(c>0)o.push(i-1);if(c<C-1)o.push(i+1);return o};
  let path=null;

    const dfs=()=>{if(p.length===N)return!cycle||nb(p[N-1]).includes(s);if(++steps>40000)return false;const u=p[p.length-1];
      const cand=shuffle(nb(u).filter(v=>!vis[v])).sort((a,b)=>free(a)-free(b));for(const v of cand){vis[v]=true;p.push(v);if(dfs())return true;p.pop();vis[v]=false}return false};
    if(dfs())path=p.slice()}
  const ek=(a,b)=>a<b?a+'-'+b:b+'-'+a;const E=new Set();for(let i=0;i<N-1;i++)E.add(ek(path[i],path[i+1]));if(cycle)E.add(ek(path[N-1],path[0]));
  const pr=[0,.5,.4,.35,.3,.3][lv];for(let i=0;i<N;i++)for(const j of nb(i))if(j>i&&!E.has(ek(i,j))&&Math.random()<pr)E.add(ek(i,j));
  const pos=[];for(let i=0;i<N;i++){const r=Math.floor(i/C),c=i%C;pos.push([c*100+50+rnd(-11,11),r*100+50+rnd(-11,11)])}
  return{N,E,pos,vb:[C*100,R*100],cycle}}
function specialHam(){const ek=(a,b)=>a<b?a+'-'+b:b+'-'+a;const E=new Set(),pos=[];const cx=200,cy=200;
  if(Math.random()<.5){const n=rnd(4,6);for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pos.push([cx+165*Math.cos(a),cy+165*Math.sin(a)])}for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n+(n%2?0:0);pos.push([cx+75*Math.cos(a),cy+75*Math.sin(a)])}
    for(let i=0;i<n;i++){E.add(ek(i,(i+1)%n));E.add(ek(n+i,n+(i+1)%n));E.add(ek(i,n+i))}return{N:2*n,E,pos,vb:[400,400],cycle:false}}
  const n=rnd(6,8);pos.push([cx,cy]);for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pos.push([cx+160*Math.cos(a),cy+160*Math.sin(a)])}
  for(let i=1;i<=n;i++){E.add(ek(i,i%n+1));if(i%2)E.add(ek(0,i))}return{N:n+1,E,pos,vb:[400,400],cycle:false}}

  round(lv,A){

      col.append(h('div',{class:'bigpic'},t.e,h('button',{class:'ear','aria-label':'Écouter : '+t.w,onclick:()=>say(t.w)},'🔊')));
      const row=h('div',{class:'choices'});for(let i=1;i<=mx;i++){const b=h('button',{class:'clap','aria-label':i+' syllabes'},h('b',null,String(i)),h('span',null,'👏'.repeat(i)));

      col.append(h('div',{class:'bigpic'},ref.e,h('button',{class:'ear','aria-label':'Écouter : '+ref.w,onclick:()=>say(ref.w)},'🔊')));

      col.append(h('div',{class:'bigpic'},t.e,h('button',{class:'ear','aria-label':'Écouter : '+t.w,onclick:()=>say(t.w)},'🔊')));

      A.prompt(`Par quelle lettre commence le mot ${t.w} ?`,'Par quelle lettre commence ce mot ?');return}

  intro:"Le dragon dort dans son œuf. Lis les syllabes magiques pour le faire éclore !",
  round(lv,A,opt){
    const cons=(lv===1?'lmr':lv===2?'lmrstpn':'lmrstpnvfd').split('');const vows=lv===1?['a','i','o']:['a','i','o','u','é'];
    const combos=[];cons.forEach(c=>vows.forEach(v=>combos.push(c+v)));
    const egg=h('div',{class:'egg wob'},'🥚');const col=h('div',{class:'col'},egg);play.append(col);
    const hatch=()=>{egg.classList.remove('wob');egg.textContent='🐲'};
    if(lv===1||lv===2||lv===4){let t,ch;
      if(lv===4){t=opt?opt.t:wpick(SYC,s=>freshW('S:'+s));const c0=t.startsWith('ch')?'ch':t[0];const sim=SYC.filter(s=>s!==t&&(s.startsWith(c0)||s.slice(s.startsWith('ch')?2:1)===t.slice(c0.length)));ch=[t,...shuffle(sim).slice(0,3)];while(ch.length<4){const r=pick(SYC);if(!ch.includes(r))ch.push(r)}shuffle(ch)}

      A.prompt(`Touche la syllabe ${t}.`,'Écoute, puis touche la bonne syllabe.');return}
    if(lv===3){const t=wpick(combos,s=>freshW('S:'+s));const c=t[0],v=t.slice(1);let sc=null,svv=null;
      const s1=h('div',{class:'slotb'}),s2=h('div',{class:'slotb'});const slots=h('div',{class:'slots'},s1,s2);
      const ct=shuffle([c,...shuffle(cons.filter(x=>x!==c)).slice(0,2)]),vt=shuffle([v,...shuffle(vows.filter(x=>x!==v)).slice(0,2)]);
      const upd=()=>{s1.textContent=sc||'';s2.textContent=svv||'';s1.classList.toggle('fill',!!sc);s2.classList.toggle('fill',!!svv)};
      const check=()=>{if(sc&&svv){if(sc+svv===t){hatch();A.right('S:'+t)}else{A.wrong(slots,'Ce n’est pas tout à fait ça.');sc=svv=null;setTimeout(upd,400)}}};
      const mk=(arr,isC)=>{const r=h('div',{class:'tiles'});arr.forEach(x=>{const b=h('button',{class:'lb small','aria-label':'lettre',style:`--bc:${isC?'#d5ebff':'#ffd6ea'}`},x);b.onclick=()=>{if(cur.busy)return;sfx('tap');if(isC)sc=x;else svv=x;upd();check()};if((isC&&x===c)||(!isC&&x===v))b.dataset.ok=1;r.append(b)});return r};
      const rc=mk(ct,true),rv=mk(vt,false);col.append(slots,rc,rv);upd();
      cur.hint=m=>{col.querySelectorAll('[data-ok]').forEach(b=>b.classList.add('hint'));say(m+' Regarde ce qui brille. '+cur.prompt)};

    const [w,e,sy]=wpick(WSY,x=>freshW('E:'+x[0]));let filled=[];
    egg.textContent=e;egg.classList.remove('wob');egg.classList.add('bigpic');
    const slots=h('div',{class:'slots'});const sl=sy.map(()=>{const s=h('div',{class:'slotb'});slots.append(s);return s});

    slots.onclick=()=>{if(cur.busy)return;filled.pop();upd()};
    col.append(slots,row);upd();
    cur.hint=m=>{const next=sy[filled.length]||sy[0];[...row.children].forEach(b=>{if(b.textContent===next)b.classList.add('hint')});say(m+' Écoute les syllabes : '+sy.join(' ... ')+'.',null,.7)};
    A.prompt(`Écris le mot ${w} avec les syllabes.`,'Écris le mot avec les syllabes.');
  }
};

/* un fichier son : 6 s au plus par essai, deux essais ; un échec n'est jamais retenu (sinon un petit raté de réseau
   condamnait ce son à la voix de l'iPad pour toute la séance) */
function sndFetch(path){const once=()=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),6000);
    return fetch(path,{signal:c.signal}).then(r=>{if(!r.ok)throw 0;return r.blob()}).finally(()=>clearTimeout(t))};
  return once().catch(()=>once()).then(b=>URL.createObjectURL(b))}
function sndLoad(path){if(!(path in sndUrl))sndUrl[path]=sndFetch(path).catch(()=>{delete sndUrl[path];return null});return sndUrl[path]}
/* préchargement : deux fichiers à la fois, pour ne pas écraser la connexion au moment où l'on a besoin d'un son précis */
const sndQ=[];let sndQn=0;
function sndQueue(path){if(path in sndUrl||sndQ.includes(path))return;sndQ.push(path);sndPump()}
function sndPump(){while(sndQn<2&&sndQ.length){const p=sndQ.shift();if(p in sndUrl)continue;sndQn++;sndLoad(p).finally(()=>{sndQn--;sndPump()})}}
const sndPath=(cat,x)=>SND_SET[cat].has(x)?'sons/'+cat+'/'+SKEY(x)+'.mp3':null;
function sndPreload(gs,cat){gs.forEach(g=>{const p=sndPath(cat||'ph',g);if(p)sndQueue(p)})}
/* joue un fichier son ; sinon la voix de l'appareil dit le texte de secours */
function sndPlay(path,fbText,onend,rate){const tok=++sndTok;let done=false,fell=false,started=false;const fin=()=>{if(!done&&tok===sndTok){done=true;onend&&onend()}};
  const fb=()=>{if(fell||done||tok!==sndTok)return;fell=true;if(started)try{sndEl.pause()}catch(e){}ttsSay(fbText,fin,rate)};
  if(!path){fb();return}
  try{if(hasTTS)speechSynthesis.cancel()}catch(e){}
  const tw=setTimeout(()=>{if(!started)fb()},4500);      /* fichier trop long à arriver : la voix de l'appareil prend le relais */
  sndLoad(path).then(u=>{clearTimeout(tw);if(tok!==sndTok||fell)return;if(!u){fb();return}
    started=true;
    try{sndEl.pause();sndEl.onended=fin;sndEl.onerror=fb;sndEl.src=u;const p=sndEl.play();if(p&&p.catch)p.catch(fb)}catch(e){fb()}
    /* garde-fous : un son qui n'a pas démarré après 2,5 s est abandonné ; sinon on attend sa fin réelle (les consignes peuvent durer plusieurs secondes), au plus ~20 s */
    let n=0;const wd=ms=>setTimeout(()=>{if(done||fell||tok!==sndTok)return;if(n===0&&!sndEl.ended&&sndEl.currentTime<.05){fb();return}
      if(sndEl.paused||sndEl.ended||++n>5)fin();else wd(3500)},ms);wd(2500)})}
function snd(g,onend){sndPlay(sndPath('ph',g),SNDT(g),onend)}
const pSn=g=>cb=>snd(g,cb);
/* hibou : noms des lettres et phrases en fichiers son, pour ne pas dépendre de la voix de l'iPad */
const pLn=L=>cb=>sndPlay(sndPath('ln',L),'la lettre '+LN[L],cb);
const pLf=(k,t)=>cb=>sndPlay(sndPath('ln',k),t,cb);
const pSeq=(...ps)=>cb=>{let i=0;const nx=()=>{if(i<ps.length)ps[i++](nx);else cb&&cb()};nx()};            /* lecteur : son enregistré */
const pSy=s=>cb=>sndPlay(sndPath('sy',s),s,cb,.8);   /* lecteur : syllabe */
const pW=w=>cb=>sndPlay(sndPath('w',w),w,cb);          /* lecteur : mot */

/* progression par paliers : le palier suivant ne s'ouvre que lorsque toutes les notions des paliers
   déjà ouverts sont acquises (3 réussites du premier coup). On ne brûle donc aucune étape. */
const okN=k=>{const it=st.items[k];return it?it.ok:0};
function openPaliers(order,pre){let n=1;for(let i=0;i<order.length-1;i++){if(order[i].every(x=>okN(pre+x)>=3))n=i+2;else break}return n}
const openItems=(order,pre)=>order.slice(0,openPaliers(order,pre)).flat();
function stepTarget(order,pre){const open=openItems(order,pre),nw=order[openPaliers(order,pre)-1];
  const fresh=nw.filter(x=>status(pre+x)!=='acquis');const pool=Math.random()<.65?(fresh.length?fresh:nw):open;return wpick(pool,x=>focusW(pre+x))}

/* sons des lettres, dans l'ordre d'apprentissage (voyelles, puis consonnes qui se prolongent, puis consonnes brèves) */
const SKY_ORDER=[['a','i','o'],['u','é','e'],['l','m','r'],['s','f','v'],['n','j','p'],['t','d','b'],['c','g','z']];
const SKY_ALL=SKY_ORDER.flat();const SKY_V=['a','i','o','u','é','e'];const isV=g=>SKY_V.includes(g);
/* les 26 lettres, pour les trois écritures */
const FORM_ORDER=[['a','e','i','o','u'],['l','m','r','s','f','v'],['n','p','t','j','y','z'],['b','d','q','g','c','k'],['h','w','x']];
const FORMN={cap:'en grand',low:'en petit',cur:'en attaché'};
const fdisp=(x,f)=>({t:f==='cap'?x.toUpperCase():x,cur:f==='cur'});
const BC=['#ffd6ea','#d5ebff','#fff0b3','#d7f4dc','#e7dbff'];

/* ---- briques communes ---- */
function replayPrompt(pre){if(!cur)return;const t0=((pre?pre+' ':'')+cur.prompt).trim();if(!t0&&cur.pplay){cur.pplay();return}say((pre?pre+' ':'')+cur.prompt,cur.pplay?()=>{if(cur&&cur.pplay)cur.pplay()}:null)}
function promptS(A,spoken,shown,pl){cur.prompt=spoken;cur.pplay=pl||null;$('#ptext').textContent=shown||spoken;const t=((cur.intro?cur.intro+' ':'')+spoken).trim();cur.intro=null;if(!t&&pl){pl();return}say(t,pl?()=>{if(cur&&cur.pplay===pl)pl()}:null)}
/* mauvaise réponse : on entend ce que l'on a touché, puis la consigne */
function wrongS(el,pl,A){if(!cur||cur.busy||cur.lock)return;cur.firstTry=false;cur.errors++;sfx('no');shake(el);const rid=cur.rid;cur.lock=true;
  setTimeout(()=>{if(!cur||cur.rid!==rid)return;const go=once(()=>{if(!cur||cur.rid!==rid)return;cur.lock=false;if(cur.errors>=2&&cur.hint)cur.hint('Essaie encore.');else replayPrompt('Essaie encore.')},9000);pl?pl(go):go()},260)}
/* bonne réponse : on entend la bonne réponse, puis la fée félicite */
function once(f,ms){let d=false,t;const g=()=>{if(d)return;d=true;clearTimeout(t);f()};t=setTimeout(g,ms);return g}   /* filet : si un son se perd, la suite part quand même */
function rightS(el,key,pl,A){if(!cur||cur.busy||cur.lock)return;cur.lock=true;el&&el.classList.add('pop');const rid=cur.rid;const go=once(()=>{if(!cur||cur.rid!==rid)return;cur.lock=false;A.right(key)},9000);pl?pl(go):go()}
const guard=()=>cur&&!cur.busy&&!cur.lock;
/* dernier filet : si un son perdu laisse l'écran verrouillé plus de 12 s, on le libère */
setInterval(()=>{if(!cur)return;if(!cur.lock){cur.lkR=null;return}const k=cur.rid+':'+(cur.lkN||0);if(cur.lkR!==k){cur.lkR=k;cur.lkS=Date.now();return}if(Date.now()-cur.lkS>12000){cur.lock=false;cur.lkR=null;cur.lkN=(cur.lkN||0)+1;try{sndEl.pause()}catch(e){}}},1500);
function face(d){return h('span',{class:(d.cur?'cur':'')+(/[a-zà-ÿ]/i.test(d.t)&&d.t.length>3?' long':'')},d.t)}

/* écoute, puis touche la bonne bulle */
function hearRound(A,o){const col=h('div',{class:'col'});play.append(col);const row=h('div',{class:o.big?'tiles':'bubbles'});
  o.choices.forEach((x,i)=>{const d=o.disp(x);const b=h('button',{class:(o.big?'scard':'lb')+(d.cur?' cur':''),'aria-label':o.label||'bulle',style:`--bc:${BC[i%5]};animation-delay:${-i*.8}s`},d.t);
    b.onclick=()=>{if(!guard())return;if(x===o.t)rightS(b,o.key,o.play(x),A);else wrongS(b,o.play(x),A)};if(x===o.t){A.hintEl(b);b.dataset.ok=1}row.append(b)});
  col.append(row);if(o.hint)cur.hint=o.hint;promptS(A,o.prompt,o.shown,o.pprompt)}
/* lis, puis choisis le bon son parmi ceux que l'on écoute */
function readRound(A,o){const col=h('div',{class:'col'});play.append(col);const d=o.disp(o.t);col.append(h('div',{class:'model'+(d.cur?' cur':'')},d.t));
  const row=h('div',{class:'lopts'});let okBtn=null;
  o.choices.forEach((x,i)=>{const spk=h('button',{class:'spk','aria-label':'écouter le son '+(i+1),style:`--bc:${BC[i%5]}`},'🔊');
    spk.onclick=()=>{if(!guard())return;row.querySelectorAll('.spk').forEach(s=>s.classList.remove('playing'));spk.classList.add('playing');o.play(x)(()=>spk.classList.remove('playing'))};
    const ok=h('button',{class:'pickb','aria-label':'choisir le son '+(i+1)},'✓');if(x===o.t){okBtn=ok;ok.dataset.ok=1}
    ok.onclick=()=>{if(!guard())return;if(x===o.t)rightS(ok,o.key,o.play(x),A);else wrongS(ok,null,A)};
    row.append(h('div',{class:'lopt'},spk,ok))});
  col.append(row);cur.hint=m=>{okBtn.classList.add('hint');say(m+' Le bon son est celui-ci : ',()=>o.play(o.t)())};
  A.prompt(o.prompt,o.shown)}
/* cherche et trouve : toutes les bulles du même son dans un paysage de nuages */
function findRound(A,o){const col=h('div',{class:'col'});play.append(col);const F=h('div',{class:'field'});const cnt=h('div',{class:'found'});
  const portrait=innerWidth<innerHeight;const cols=portrait?3:(o.items.length>9?5:4),rows=portrait?Math.ceil(o.items.length/3)+1:3;const cells=shuffle([...Array(cols*rows).keys()]).slice(0,o.items.length);let got=0;const need=o.items.filter(x=>x.v===o.t).length;
  const upd=()=>{cnt.textContent='★'.repeat(got)+'☆'.repeat(need-got)};
  o.items.forEach((x,i)=>{const c=cells[i],cx=c%cols,cy=Math.floor(c/cols);const L=(cx+.5)/cols*100+(Math.random()-.5)*24/cols,T=(cy+.5)/rows*100+(Math.random()-.5)*24/rows;
    const b=h('button',{class:'fb'+(x.d.cur?' cur':'')+(x.d.t.length>2?' long':''),'aria-label':'bulle',style:`--bc:${BC[i%5]};animation-delay:${-Math.random()*4}s`},x.d.t);
    b.onclick=()=>{if(!guard()||b.classList.contains('got'))return;
      if(x.v===o.t){b.classList.add('got');got++;upd();if(got===need)rightS(null,o.key,o.play(x.v),A);else{cur.lock=true;o.play(x.v)(()=>{if(cur)cur.lock=false})}}
      else wrongS(b,o.play(x.v),A)};
    if(x.v===o.t)b.dataset.ok=1;F.append(h('span',{class:'fw',style:`left:${L}%;top:${T}%`},b))});
  cur.hint=m=>{F.querySelectorAll('[data-ok]:not(.got)').forEach(b=>b.classList.add('hint'));replayPrompt(m+' Regarde ce qui brille.')};
  col.append(cnt,F);upd();promptS(A,o.prompt,o.shown,o.pprompt)}
/* memory : retrouver les paires ; une paire trouvée fait entendre son son */
function memRound(A,o){const P=o.pairs.length;const cards=shuffle(o.pairs.flatMap(p=>[{id:p.id,d:p.a},{id:p.id,d:p.b}]));
  const g=h('div',{class:'mem',style:`--mc:${P<=3?3:4}`});let open=[],found=0,mism=0;
  const back=c=>{c.up=false;c.el.classList.remove('up');c.el.textContent='☁️'};
  cards.forEach(c=>{const b=h('button',{class:'mc','aria-label':'carte','data-k':c.id},'☁️');c.el=b;
    b.onclick=()=>{if(!guard()||c.up||open.length>=2)return;sfx('tap');c.up=true;b.classList.add('up');b.textContent='';b.append(face(c.d));open.push(c);
      if(open.length<2)return;const [x,y]=open;
      if(x.id===y.id){x.el.classList.add('ok');y.el.classList.add('ok');found++;open=[];cur.lock=true;const rid=cur.rid;
        o.play(x.id)(()=>{if(!cur||cur.rid!==rid)return;cur.lock=false;if(found===P){if(mism>P+1)cur.firstTry=false;A.right(o.key)}})}
      else{mism++;setTimeout(()=>{back(x);back(y);open=[]},950)}};g.append(b)});
  play.append(h('div',{class:'col'},g));A.prompt(o.prompt,o.shown)}
/* lettres proches à ne pas confondre */
function confOf(x,pool){const grp=[...new Set([...CONF,...CUR_CONF].filter(g=>g.includes(x)).flat())].filter(y=>y!==x&&pool.includes(y));return grp}
function distract(t,pool,n,pref){pool=[...new Set(pool)];const a=shuffle((pref||[]).filter(x=>x!==t&&pool.includes(x))).slice(0,n);shuffle(pool.filter(x=>x!==t&&!a.includes(x))).forEach(x=>{if(a.length<n)a.push(x)});return a}

/* ---- Perroquet : le son de chaque lettre ---- */
MODS.parrot={
  intro:"Le perroquet du ciel répète tous les sons des lettres. Écoute-le bien !",
  round(lv,A,opt){
    const open=openItems(SKY_ORDER,'Sn:');sndPreload(open);
    const t=opt&&opt.t||stepTarget(SKY_ORDER,'Sn:');const key='Sn:'+t;
    const k=opt&&opt.k||(lv<=1?'hear':lv===2?pick(['hear','read']):lv===3?pick(['find','read','hear']):lv===4?pick(['mem','find','read']):pick(['hear','read','find','mem']));
    const n=Math.min(open.length,lv<=2?3:4);const forms=lv>=3?['low','cap','cur']:['low'];
    const pref=isV(t)?open.filter(isV):open.filter(x=>!isV(x));
    if(k==='hear'){const ch=shuffle([t,...distract(t,open,n-1,pref)]);const fm={};ch.forEach(x=>fm[x]=pick(forms));
      hearRound(A,{t,choices:ch,disp:x=>fdisp(x,fm[x]),play:pSn,key,label:'lettre',prompt:'Touche la lettre qui fait…',shown:'Écoute le son, puis touche la bonne lettre.',pprompt:pSn(t)});return}
    if(k==='read'){const ch=shuffle([t,...distract(t,open,n-1,pref)]);
      readRound(A,{t,choices:ch,disp:x=>fdisp(x,pick(forms)),play:pSn,key,prompt:'Regarde bien cette lettre. Écoute les sons, et choisis le son de la lettre.',shown:'Écoute les sons, puis choisis celui de la lettre.'});return}
    if(k==='find'){const N=lv>=4?12:9,T=N>9?3:2;const others=open.filter(x=>x!==t);const items=[];
      for(let i=0;i<T;i++)items.push({v:t,d:fdisp(t,pick(forms))});while(items.length<N){const x=pick(others.length?others:open);if(x!==t)items.push({v:x,d:fdisp(x,pick(forms))})}
      findRound(A,{t,items:shuffle(items),play:pSn,key,prompt:'Trouve toutes les lettres qui font…',shown:'Trouve toutes les lettres de ce son.',pprompt:pSn(t)});return}
    const ids=shuffle([t,...distract(t,open,Math.min(open.length,lv>=5?4:3)-1)]);
    memRound(A,{pairs:ids.map(x=>{const [f1,f2]=shuffle(['low','cap','cur']);return{id:x,a:fdisp(x,f1),b:fdisp(x,f2)}}),play:pSn,key:'Mm:parrot',
      prompt:'Retourne les nuages et trouve les paires : la même lettre, écrite de deux façons.',shown:'Trouve les paires de lettres.'})
  }
};

/* ---- Colombe : les trois écritures d'une lettre ---- */
MODS.dove={
  intro:"La colombe connaît les trois écritures : en grand, en petit, et en attaché. Apprends-les avec elle !",
  round(lv,A,opt){
    const open=openItems(FORM_ORDER,'Fo:');const t=opt&&opt.t||stepTarget(FORM_ORDER,'Fo:');const key='Fo:'+t,T=t.toUpperCase();
    const k=opt&&opt.k||(lv<=1?'cl':lv===2?'lc':lv===3?pick(['cc','ca','lc','cl']):lv===4?pick(['mem','cc','ca']):pick(['conf','conf','mem','cc']));
    if(k==='mem'){const ids=shuffle([t,...distract(t,open,Math.min(open.length,lv>=5?4:3)-1)]);
      memRound(A,{pairs:ids.map(x=>{const [f1,f2]=pick([['cap','cur'],['low','cur'],['cap','low']]);return{id:x,a:fdisp(x,f1),b:fdisp(x,f2)}}),play:x=>cb=>say('la lettre '+LN[x.toUpperCase()],cb),key:'Mm:dove',
        prompt:'Retourne les nuages et trouve les paires : la même lettre, dans deux écritures.',shown:'Trouve les paires de lettres.'});return}
    const [fa,fb]=k==='cl'?['cap','low']:k==='lc'?['low','cur']:k==='cc'?['cap','cur']:k==='ca'?['cur','cap']:shuffle(['cap','low','cur']).slice(0,2);
    const n=k==='conf'?5:lv<=1?3:4;const ds=distract(t,open,n-1,k==='conf'||lv>=3?confOf(t,open):null);
    const col=h('div',{class:'col'});play.append(col);const md=fdisp(t,fa);col.append(h('div',{class:'model'+(md.cur?' cur':'')},md.t));
    const bub=h('div',{class:'bubbles'});shuffle([t,...ds]).forEach((x,i)=>{const d=fdisp(x,fb);const b=h('button',{class:'lb'+(d.cur?' cur':''),'aria-label':'lettre',style:`--bc:${BC[i%5]};animation-delay:${-i*.8}s`},d.t);
      b.onclick=()=>{if(!guard())return;if(x===t){b.classList.add('pop');A.right(key)}else A.wrong(b,`Ça, c'est la lettre ${LN[x.toUpperCase()]}.`)};if(x===t){A.hintEl(b);b.dataset.ok=1}bub.append(b)});
    col.append(bub);
    A.prompt(`Voici la lettre ${LN[T]}, écrite ${FORMN[fa]}. Trouve la même lettre, écrite ${FORMN[fb]}.`,`Trouve la même lettre, écrite ${FORMN[fb]}.`)
  }
};

/* ---- Abeille : les syllabes, seulement avec des sons déjà acquis ---- */
const SYL_BAD=new Set(['ci','ce','cé','cu','gi','ge','gé']);
const sylOf=(C,V)=>C.flatMap(c=>V.map(v=>c+v)).filter(s=>!SYL_BAD.has(s));
const SYL_SKY=sylOf(SKY_ALL.filter(x=>!isV(x)),SKY_V);
function beeLetters(){const ok=x=>status('Sn:'+x)==='acquis';return{C:SKY_ALL.filter(x=>!isV(x)&&ok(x)),V:SKY_V.filter(ok)}}
function beePool(){const {C,V}=beeLetters();const p=sylOf(C,V);return p.length>=4?p:['la','li','lo','ma','mi','mo']}
const sylCV=s=>[s[0],s.slice(1)];
const beeNeed=()=>{const {C,V}=beeLetters();return ['a','i','o'].every(v=>V.includes(v))&&C.length>=2};
/* ce qui manque pour réveiller l'abeille, dit simplement (sans épeler les consonnes, que la voix lit mal) */
function beeHint(){const {C,V}=beeLetters(),mv=['a','i','o'].filter(v=>!V.includes(v)),nc=Math.max(0,2-C.length);
  const want=[mv.length?'les sons '+listFr(mv):null,nc===2?'deux consonnes':nc===1?'encore une consonne':null].filter(Boolean);
  return `Elle se réveillera quand tu connaîtras, avec le perroquet, ${want.join(' et ')}. `+(C.length?`Tu connais déjà ${C.length===1?'une consonne':NW[C.length]+' consonnes'} : continue !`:'Continue avec le perroquet !')}
MODS.bee={
  intro:"L'abeille fabrique des syllabes avec les sons des lettres. Écoute bien, et lis avec elle !",
  round(lv,A,opt){
    const pool=beePool();const {C,V}=beeLetters();sndPreload([...C,...V]);sndPreload(pool,'sy');
    const t=opt&&opt.t||wpick(pool,s=>focusW('S:'+s)*(C.length&&s[0]===C[C.length-1]?2:1));const key='S:'+t;const [c,v]=sylCV(t);
    const k=opt&&opt.k||(lv<=1?'hear':lv===2?pick(['hear','read']):lv===3?pick(['find','read','build']):lv===4?pick(['mem','build','read','find']):pick(['hear','read','find','mem','build']));
    const near=pool.filter(s=>s!==t&&(s[0]===c||s.slice(1)===v));const n=lv<=1?3:4;
    const fuse=m=>say(m+' Écoute :',()=>snd(c,()=>snd(v,()=>pSy(t)())));
    if(k==='hear'){const ch=shuffle([t,...distract(t,pool,n-1,near)]);
      hearRound(A,{t,choices:ch,big:true,disp:x=>({t:x,cur:lv>=4&&Math.random()<.4}),play:pSy,key,label:'syllabe',prompt:`Touche la syllabe ${t}.`,shown:'Écoute, puis touche la bonne syllabe.',
        hint:m=>{play.querySelectorAll('.scard').forEach(b=>{if(b.textContent===t)b.classList.add('hint')});fuse(m)}});return}
    if(k==='read'){const ch=shuffle([t,...distract(t,pool,n-2,near)]);
      readRound(A,{t,choices:ch,disp:x=>({t:x,cur:lv>=4&&Math.random()<.4}),play:pSy,key,prompt:'Lis cette syllabe. Écoute les sons, et choisis le bon.',shown:'Lis la syllabe, puis choisis le bon son.'});return}
    if(k==='find'){const N=lv>=4?12:9,T=N>9?3:2;const others=distract(t,pool,6,near);const items=[];
      for(let i=0;i<T;i++)items.push({v:t,d:{t,cur:lv>=4&&i===1}});while(items.length<N)items.push({v:pick(others),d:{t:'',cur:false}});items.forEach(x=>{if(!x.d.t)x.d.t=x.v});
      findRound(A,{t,items:shuffle(items),play:pSy,key,prompt:`Trouve toutes les bulles ${t}.`,shown:'Trouve toutes les bulles de cette syllabe.'});return}
    if(k==='build'){const cs=shuffle([c,...distract(c,C.length>=3?C:[...C,'l','m','r'],2)]),vs=shuffle([v,...distract(v,V,2)]);let sc=null,sv2=null;
      const col=h('div',{class:'col'});play.append(col);const s1=h('div',{class:'slotb'}),s2=h('div',{class:'slotb'});const slots=h('div',{class:'slots'},s1,s2);
      const upd=()=>{s1.textContent=sc||'';s2.textContent=sv2||'';s1.classList.toggle('fill',!!sc);s2.classList.toggle('fill',!!sv2)};
      const check=()=>{if(!(sc&&sv2))return;const s=sc+sv2;if(s===t)rightS(slots,key,pSy(t),A);else{const got=s;sc=sv2=null;setTimeout(upd,500);wrongS(slots,pSy(got),A)}};
      const mk=(arr,isC)=>{const r=h('div',{class:'tiles'});arr.forEach(x=>{const b=h('button',{class:'lb small','aria-label':'lettre',style:`--bc:${isC?'#d5ebff':'#ffd6ea'}`},x);

function pour(t,a,b,cap){const A=t[a],B=t[b];if(a===b||!A.length||B.length>=cap)return 0;const c=A[A.length-1];if(B.length&&B[B.length-1]!==c)return 0;let n=0;while(A.length&&A[A.length-1]===c&&B.length<cap){B.push(A.pop());n++}return n}
const pSolved=(t,cap)=>t.every(x=>!x.length||(x.length===cap&&x.every(y=>y===x[0])));
const pKey=t=>t.map(x=>x.join('')).sort().join('|');
function pBfs(t0,cap,limit){const seen=new Set([pKey(t0)]);let fr=[t0],d=0;
  while(fr.length){d++;const nx=[];for(const t of fr)for(let a=0;a<t.length;a++){const A=t[a];if(!A.length)continue;const c=A[A.length-1];
    for(let b=0;b<t.length;b++){if(a===b)continue;const B=t[b];if(B.length>=cap||(B.length&&B[B.length-1]!==c))continue;if(!B.length&&A.every(x=>x===c))continue;
      const n=t.map(x=>x.slice());pour(n,a,b,cap);if(pSolved(n,cap))return d;const k=pKey(n);if(seen.has(k))continue;seen.add(k);if(seen.size>limit)return null;nx.push(n)}}fr=nx}
  return null}
function potionGen(lv){const P=[0,{c:2,e:1,cap:3,min:3},{c:3,e:2,cap:3,min:5},{c:3,e:1,cap:4,min:7},{c:4,e:2,cap:4,min:9},{c:5,e:2,cap:4,min:11}][lv];let best=null;
  for(let k=0;k<(lv===5?40:120);k++){const u=[];for(let i=0;i<P.c;i++)for(let j=0;j<P.cap;j++)u.push(i);shuffle(u);const t=[];for(let i=0;i<P.c;i++)t.push(u.slice(i*P.cap,(i+1)*P.cap));for(let i=0;i<P.e;i++)t.push([]);
    if(pSolved(t,P.cap))continue;const d=pBfs(t,P.cap,lv===5?40000:60000);if(d==null)continue;if(d>=P.min)return{tubes:t,cap:P.cap};if(!best||d>best.d)best={tubes:t,cap:P.cap,d}}
  return best||{tubes:[[0,1,0],[1,0,1],[]],cap:3}}

    h('h3',null,'Mots lus en attaché'),(()=>{const c=seenChips('Wc:');c.classList.add('cur');return c})(),
    h('h3',null,'Mots écrits avec des syllabes'),seenChips('E:'),
    h('h3',null,'Phonologie'),h('p',null,`Syllabes comptées : ${sumN(/^Sy:/)} · Rimes trouvées : ${sumN(/^R:/)} · Premier son : ${sumN(/^(I|Sd):/)} · Phrases comprises : ${sumN(/^Ph:/)}`),
    h('h3',null,'Lettre du début des mots'),seenChips('I:'),
    h('h3',null,'Dénombrement (donner une quantité)'),chips([...Array(20).keys()].map(n=>'N:'+(n+1)),[...Array(20).keys()].map(n=>String(n+1))),
    h('h3',null,'Petits problèmes'),chips(['Pb:comparer','Pb:ajouter','Pb:retirer','Pb:cacher','Pb:calcul'],['comparer','ajouter','retirer','partie cachée','calcul + −']),
    h('h3',null,'Formes'),chips(['F:rond','F:carre','F:triangle','F:rect','F:c3','F:c4','F:c5','F:c6'],['rond','carré','triangle','rectangle','3 côtés','4 côtés','5 côtés','6 côtés']),
    h('h3',null,'Repérage dans l’espace'),chips(['P:dessus','P:dessous','P:gauche','P:droite','P:entre','P:grille','P:programme'],['au-dessus','en dessous','à gauche','à droite','entre','déplacement','programmer un chemin']),
    h('h3',null,'Grandeurs'),chips(['M:long','M:court','M:lourd','M:leger','M:trans'],['plus longue','plus courte','plus lourd','plus léger','deux balances']),
    h('h3',null,'Logique (énigmes résolues)'),
    h('p',null,`Potions : ${sumN(/^P:\d$/)} · Chemins et circuits : ${sumN(/^H:/)} · Suites, intrus, sudokus, devinettes : ${sumN(/^T:/)}`),
    h('div',{class:'legend'},h('span',{class:'chip acquis'},'A'),'acquis',h('span',{class:'chip cours'},'A'),'en cours',h('span',{class:'chip nv'},'A'),'pas encore vu'));
  const zone=h('div',null);const resetBtn=h('button',{class:'danger',onclick:()=>{zone.innerHTML='';zone.append(h('div',{class:'confirm'},h('span',null,'Effacer toute la progression ?'),
    h('button',{class:'danger',onclick:()=>{st=fresh();forcePush=true;save();P.hidden=true;renderMap()}},'Oui, tout effacer'),h('button',{class:'bigbtn alt',style:'padding:8px 14px;font-size:.95rem',onclick:()=>{zone.innerHTML='';zone.append(resetBtn)}},'Annuler')))}},'Remettre la progression à zéro');
  zone.append(resetBtn);sheet.append(h('h3',null,'Réglages'),zone,h('p',{class:'muted',style:'margin-top:18px;font-size:.8rem'},'Voix des sons, syllabes et mots : enregistrée par Papa 💛 (la voix de synthèse Piper « siwis », licence CC BY 4.0, ne sert plus que de secours).'));
  P.append(sheet);P.hidden=false;P.scrollTop=0;
}

/* ================= démarrage ================= */
function showWho(){
  const L=$('#whoList');L.innerHTML='';const p=plist();
  p.list.forEach(x=>{const b=h('button',{class:'whobtn',type:'button',onclick:()=>choose(x.n)},x.n);L.append(b)});
  $('#whoMsg').textContent='';$('#start').hidden=false;$('#whoName').value=''}
async function choose(name){
  const msg=$('#whoMsg');msg.textContent='Je te cherche…';
  document.querySelectorAll('.whobtn,#whoGo').forEach(b=>b.disabled=true);
  try{await enter(name)}catch(e){msg.textContent='Oups, réessaie.';document.querySelectorAll('.whobtn,#whoGo').forEach(b=>b.disabled=false);return}
  document.querySelectorAll('.whobtn,#whoGo').forEach(b=>b.disabled=false);begin()}
$('#whoForm').onsubmit=e=>{e.preventDefault();const v=$('#whoName').value.trim();if(!slug(v)){$('#whoMsg').textContent='Écris ton prénom avec des lettres.';return}choose(v)};
$('#sync').onclick=()=>{push();if(hasTTS)try{speechSynthesis.cancel()}catch(e){}showWho()};
function begin(){$('#start').hidden=true;sfx('tap');sndUnlock();try{document.fonts&&(document.fonts.load('48px "Playwrite FR Trad"','abc'),document.fonts.load('48px "PW b"','b'))}catch(e){}st.visits++;save();renderMap();
  const fr=GAMES.filter(g=>st.games[g.id].freed).length;
  say(st.visits<=1?"Bonjour, petite fée ! Une sorcière a plongé la forêt dans l'ombre. Les animaux sont prisonniers. Touche un animal pour l'aider !"
    :st.games.siren.freed?"Bravo, grande gardienne ! Toute la forêt est sauvée. Avec quel ami veux-tu jouer ?":`Te revoilà, petite fée ! Tu as déjà libéré ${fr<=1?(fr?'un animal':'aucun animal'):NW[fr]+' animaux'}. Quel ami veux-tu aider aujourd'hui ?`);
  const uq=checkUnicorns();if(uq.length)setTimeout(()=>uniFreed(uq,()=>renderMap()),900)}
renderMap();showWho();
})();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
